    <script>
        (async function() {
            const cdnList = [
                {url: "https://raw.githubusercontent.com/", type: "raw"},
                {url: "https://cdn.jsdelivr.net/", type: "@"},
                {url: "https://esm.sh/", type: "@"},
                {url: "https://raw.githack.com/", type: "raw"},
                {url: "https://cdn.staticdelivr.com/", type: "gh-slash"},
                {url: "https://fastly.jsdelivr.net/", type: "@"},
                {url: "https://gcore.jsdelivr.net/", type: "@"},
                {url: "https://quantil.jsdelivr.net/", type: "@"},
                {url: "https://originfastly.jsdelivr.net/", type: "@"},
                {url: "https://testingcf.jsdelivr.net/", type: "@"},
                {url: "https://cdn.statically.io/", type: "@"}
            ];

            window.buildCdnUrl = function(cdn, username, repo, branch, filepath) {
                if (cdn.type === "@") {
                    return `${cdn.url}gh/${username}/${repo}@${branch}/${filepath}`;
                } else if (cdn.type === "gh-slash") {
                    return `${cdn.url}gh/${username}/${repo}/${branch}/${filepath}`;
                } else if (cdn.type === "raw") {
                    return `${cdn.url}${username}/${repo}/${branch}/${filepath}`;
                }
            };

            window.cdnList = cdnList;

            let chosenUrl = "";
            const username = "gn-sciencex";
            const repo = "gn-sciencex.github.io";
            const branch = "main";

            for (const cdn of cdnList) {
                try {
                    const testUrl = window.buildCdnUrl(cdn, username, repo, branch, "index.html");
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 2500);

                    const response = await fetch(testUrl, {
                        method: 'GET',
                        mode: 'cors',
                        signal: controller.signal
                    });

                    clearTimeout(timeoutId);
                    if (response.ok) {
                        chosenUrl = window.buildCdnUrl(cdn, username, repo, branch, "");
                        console.log(`[Base Script] Chosen CDN type: ${cdn.type} - URL: ${cdn.url}`);
                        break;
                    }
                } catch (e) {
                    console.warn(`[Base Script] ${cdn.url} failed, trying next fallback...`);
                }
            }

            if (!chosenUrl) {
                chosenUrl = window.buildCdnUrl(cdnList[0], username, repo, branch, "");
            }

            const finalBaseUrl = chosenUrl;

            let base = document.querySelector("base") || document.createElement("base");
            base.href = finalBaseUrl;

            if (!document.querySelector("base")) {
                document.head.prepend(base);
            }

            console.log("Base URL successfully set to: " + finalBaseUrl);
        })();
    </script>

    <section class="hero">
        <h1 id="heroTitle">gn-science</h1>

    <main>
        <div class="section-header">
            <h2>Browse Library</h2>
            <span id="zoneCount">Loading...</span>
        </div>

        <details id="allZonesWrapper" open>
            <summary id="allSummary">All Zones</summary>

    <div id="zoneViewer">
        <div class="zone-header">
            <div class="zone-title">
                <h2 id="zoneName">zone</h2>
                <span id="zoneId" style="display:none;"></span>

        <div class="footer-counter">

                <img src="https://www.hitwebcounter.com/counter/counter.php?page=21493765&amp;style=0036&amp;nbdigits=9&amp;type=page" alt="Fast Counter" decoding="async">
            </a>
        </div>
    </footer>

    <script>
        const container = document.getElementById('container');
        const zoneViewer = document.getElementById('zoneViewer');
        let zoneFrame = document.getElementById('zoneFrame');
        const searchBar = document.getElementById('searchBar');
        const sortOptions = document.getElementById('sortOptions');
        const zoneCount = document.getElementById('zoneCount');

        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
        });

        document.addEventListener("DOMContentLoaded", () => {
            const savedTheme = localStorage.getItem("theme");
            const themeMeta = document.querySelector('meta[name="theme-color"]');

            if (savedTheme === "light") {
                document.body.classList.remove("dark-mode");
                if (themeMeta) themeMeta.setAttribute("content", "#ffffff");
            } else {
                document.body.classList.add("dark-mode");
                if (themeMeta) themeMeta.setAttribute("content", "#14161d");
            }

            const savedName = localStorage.getItem("cloakName");
            if (savedName) {
                document.title = savedName;
            }

            const savedIcon = localStorage.getItem("cloakIcon");
            if (savedIcon) {
                const link = document.querySelector("link[rel~='icon']") || document.createElement("link");
                link.rel = "icon";
                link.href = savedIcon;
                document.head.appendChild(link);
            }
        });

        setTimeout(() => {
            const decode = (str) => atob(str);
            
            const logoEl = document.getElementById("logoText");
            if (logoEl) logoEl.textContent = decode("TWFydHkgR2FtZXM=");

            const heroTitleEl = document.getElementById("heroTitle");
            if (heroTitleEl) heroTitleEl.textContent = decode("TWFydHkgR2FtZXM=");

            const heroDescEl = document.getElementById("heroDesc");
            if (heroDescEl) {
                heroDescEl.textContent = decode(
                    "Tm8gZG93bmxvYWRzLiBObyByZXN0cmljdGlvbnMuIEp1c3QgZmFzdCwgZnJlZSwgYW5kIGNvbXBsZXRlbHkgdW5ibG9ja2VkIGdhbWVzIHJlYWR5IGZvciBhbnkgc2NyZWVuLg=="
                );
            }
        }, 2000);

        let selectedCdn = null;
        let zones = [];

        function getZoneUrl(zone) {
            if (zone.url && !zone.repository) {
                return zone.url;
            }
            const cdn = selectedCdn || (window.cdnList && window.cdnList[0]) || {
                url: "https://cdn.jsdelivr.net/",
                type: "@"
            };
            const username = zone.username || "sigmauaralarpersahur";
            const repo = zone.repository || "";
            const branch = zone.branch || "main";
            const htmlFile = zone.html || "index.html";
            const filepath = zone.path ? `${zone.path}/${htmlFile}` : htmlFile;

            if (typeof window.buildCdnUrl === "function") {
                return window.buildCdnUrl(cdn, username, repo, branch, filepath);
            }
            return `${cdn.url}gh/${username}/${repo}@${branch}/${filepath}`;
        }

        function getZoneCoverUrl(zone) {
            if (zone.cover && (zone.cover.startsWith("http://") || zone.cover.startsWith("https://"))) {
                return zone.cover;
            }
            const imgFile = zone.icon || zone.cover;
            if (!imgFile) return "";
            if (imgFile.startsWith("http://") || imgFile.startsWith("https://")) {
                return imgFile;
            }

            const cdn = selectedCdn || (window.cdnList && window.cdnList[0]) || {
                url: "https://cdn.jsdelivr.net/",
                type: "@"
            };
            const username = zone.username || "sigmauaralarpersahur";
            const repo = zone.repository || "";
            const branch = zone.branch || "main";
            const filepath = zone.path ? `${zone.path}/${imgFile}` : imgFile;

            if (typeof window.buildCdnUrl === "function") {
                return window.buildCdnUrl(cdn, username, repo, branch, filepath);
            }
            return `${cdn.url}gh/${username}/${repo}@${branch}/${filepath}`;
        }

        async function listZones() {
            let json = null;
            let resolvedItem = null;

            const username = "sigmauaralarpersahur";
            const repo = "zones";
            const branch = "main";
            const filepath = "main.json";

            const cdnDefinitions = [
                {url: "https://raw.githubusercontent.com/", type: "raw"},
                {url: "https://cdn.jsdelivr.net/", type: "@"},
                {url: "https://esm.sh/", type: "@"},
                {url: "https://raw.githack.com/", type: "raw"},
                {url: "https://cdn.staticdelivr.com/", type: "gh-slash"},
                {url: "https://fastly.jsdelivr.net/", type: "@"},
                {url: "https://gcore.jsdelivr.net/", type: "@"},
                {url: "https://quantil.jsdelivr.net/", type: "@"},
                {url: "https://originfastly.jsdelivr.net/", type: "@"},
                {url: "https://testingcf.jsdelivr.net/", type: "@"},
                {url: "https://cdn.statically.io/", type: "@"}
            ];

            for (const cdn of cdnDefinitions) {
                let fetchUrl = "";

                if (typeof window.buildCdnUrl === "function") {
                    fetchUrl = window.buildCdnUrl(cdn, username, repo, branch, filepath);
                } else {
                    if (cdn.type === "@") {
                        fetchUrl = `${cdn.url}gh/${username}/${repo}@${branch}/${filepath}`;
                    } else if (cdn.type === "gh-slash") {
                        fetchUrl = `${cdn.url}gh/${username}/${repo}/${branch}/${filepath}`;
                    } else if (cdn.type === "raw") {
                        fetchUrl = `${cdn.url}${username}/${repo}/${branch}/${filepath}`;
                    }
                }

                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 2500);

                    const response = await fetch(fetchUrl + "?t=" + Date.now(), {
                        signal: controller.signal
                    });
                    clearTimeout(timeoutId);

                    if (response.ok) {
                        json = await response.json();
                        selectedCdn = cdn;
                        resolvedItem = {
                            url: fetchUrl,
                            cdn: cdn
                        };
                        console.log(`[Zone Loader] Successfully fetched zones from CDN (${cdn.type}): ${fetchUrl}`);
                        break;
                    }
                } catch (e) {
                    console.warn(`[Zone Loader] CDN failed: ${fetchUrl}, checking next...`);
                }
            }

            if (json) {
                try {
                    zones = json;
                    populateTagDropdown();

                    if (zones.length > 0) zones[0].featured = true;
                    sortZones();

                    const search = new URLSearchParams(window.location.search);
                    const id = search.get('id');
                    const embed = window.location.hash.includes("embed");

                    if (id) {
                        const zone = zones.find(z => String(z.id) === String(id));
                        if (zone) {
                            if (embed) {
                                embedZone(zone);
                            } else {
                                openZone(zone);
                            }
                        }
                    }
                } catch (error) {
                    console.error("[Zone Loader] Error parsing zones payload:", error);
                    container.innerHTML = `Error loading zones content: ${error}`;
                }
            } else {
                container.innerHTML = `Error loading zones: All CDN options failed.`;
            }
        }

        function embedZone(zone) {
            if (zone.url && !zone.repository) {
                window.open(zone.url, "_blank");
                return;
            }

            const url = getZoneUrl(zone);

            fetch(url + "?t=" + Date.now())
                .then(response => response.text())
                .then(html => {
                    document.documentElement.innerHTML = html;
                    const popup = document.createElement("div");
                    popup.style.cssText = "position:fixed;bottom:20px;right:20px;background-color:#cce5ff;color:#004085;padding:10px;border:1px solid #b8daff;border-radius:5px;box-shadow:0px 0px 10px rgba(0,0,0,0.1);font-family:Arial,sans-serif;";
                    popup.innerHTML = `Play more games at <a href="https://marty-games.github.io" target="_blank" style="color:#004085;font-weight:bold;">https://marty-games.github.io</a>!`;

                    const closeBtn = document.createElement("button");
                    closeBtn.innerText = "✖";
                    closeBtn.style.cssText = "margin-left:10px;background:none;border:none;cursor:pointer;color:#004085;font-weight:bold;";
                    closeBtn.onclick = () => popup.remove();

                    popup.appendChild(closeBtn);
                    document.body.appendChild(popup);

                    document.querySelectorAll('script').forEach(oldScript => {
                        const newScript = document.createElement('script');
                        if (oldScript.src) {
                            newScript.src = oldScript.src;
                        } else {
                            newScript.textContent = oldScript.textContent;
                        }
                        document.body.appendChild(newScript);
                    });
                })
                .catch(error => alert("Failed to load embedded zone: " + error));
        }

        function sortZones() {
            const sortBy = sortOptions.value;
            if (sortBy === 'name') {
                zones.sort((a, b) => a.name.localeCompare(b.name));
            } else if (sortBy === 'id') {
                zones.sort((a, b) => b.id - a.id);
            }
            const pinnedIds = [-1, 0];
            zones.sort((a, b) => {
                const indexA = pinnedIds.indexOf(a.id);
                const indexB = pinnedIds.indexOf(b.id);

                if (indexA !== -1 && indexB !== -1) return indexA - indexB;
                if (indexA !== -1) return -1;
                if (indexB !== -1) return 1;
                return 0;
            });

            displayZones(zones);
        }

        function displayZones(zonesToShow) {
            container.innerHTML = "";

            zonesToShow.forEach((file) => {
                const zoneItem = document.createElement("div");
                zoneItem.className = "zone-item";
                zoneItem.onclick = () => openZone(file);

                const img = document.createElement("img");
                const placeholder = document.createElement("div");
                placeholder.className = "icon-placeholder";
                placeholder.textContent = "No icon";

                img.onerror = () => {
                    img.style.display = "none";
                    placeholder.style.display = "flex";
                };

                const coverSrc = getZoneCoverUrl(file);

                if (coverSrc) {
                    placeholder.style.display = "none";
                    img.dataset.src = coverSrc;
                    img.alt = file.name;
                    img.loading = "lazy";
                    img.className = "lazy-zone-img";
                    zoneItem.appendChild(img);
                } else {
                    img.style.display = "none";
                    placeholder.style.display = "flex";
                }
                zoneItem.appendChild(placeholder);

                const button = document.createElement("button");
                button.setAttribute("title", file.name);
                button.innerHTML = `<div class="zone-name">${file.name}</div><div class="zone-subtitle">${Array.isArray(file.special) ? file.special.join(" • ") : (file.special || "")}</div>`;

                button.onclick = (event) => {
                    event.stopPropagation();
                    openZone(file);
                };

                zoneItem.appendChild(button);
                container.appendChild(zoneItem);
            });

            if (zonesToShow.length === 0) {
                container.innerHTML = "No results.";
                zoneCount.textContent = "0 available";
                document.getElementById("allSummary").textContent = "All Zones (0)";
            } else {
                zoneCount.textContent = `${zonesToShow.length} available`;
                document.getElementById("allSummary").textContent = `All Zones (${zonesToShow.length})`;
            }

            const lazyImages = document.querySelectorAll('img.lazy-zone-img');
            const imageObserver = new IntersectionObserver((entries, observer) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const img = entry.target;
                        img.src = img.dataset.src;
                        img.classList.remove("lazy-zone-img");
                        observer.unobserve(img);
                    }
                });
            }, {
                rootMargin: "100px",
                threshold: 0.1
            });

            lazyImages.forEach(img => {
                imageObserver.observe(img);
            });
        }

        function filterZones() {
            const query = searchBar.value.toLowerCase();
            const selectedTag = document.getElementById('tagOptions').value;

            const filtered = zones.filter(zone => {
                const matchesQuery = !query || zone.name.toLowerCase().includes(query);

                let matchesTag = false;
                if (selectedTag === 'all') {
                    matchesTag = true;
                } else if (Array.isArray(zone.special)) {
                    matchesTag = zone.special.includes(selectedTag);
                } else if (zone.special) {
                    matchesTag = zone.special === selectedTag;
                }

                return matchesQuery && matchesTag;
            });

            displayZones(filtered);
        }

        function populateTagDropdown() {
            const tagOptions = document.getElementById('tagOptions');
            if (!tagOptions) return;

            tagOptions.innerHTML = '<option value="all">All Tags</option>';

            const tagsSet = new Set();
            zones.forEach(zone => {
                if (Array.isArray(zone.special)) {
                    zone.special.forEach(tag => tagsSet.add(tag));
                } else if (zone.special) {
                    tagsSet.add(zone.special);
                }
            });

            Array.from(tagsSet).sort().forEach(tag => {
                if (tag.toLowerCase() === "advertisement") return;

                const option = document.createElement('option');
                option.value = tag;
                option.textContent = tag;
                tagOptions.appendChild(option);
            });
        }

        function openZone(file) {
            if (file.url && !file.repository) {
                window.open(file.url, "_blank");
            } else {
                const url = getZoneUrl(file);
                fetch(url + "?t=" + Date.now()).then(response => response.text()).then(html => {
                    if (zoneFrame.contentDocument === null) {
                        zoneFrame = document.createElement("iframe");
                        zoneFrame.id = "zoneFrame";
                        zoneViewer.appendChild(zoneFrame);
                    }
                    zoneFrame.contentDocument.open();
                    zoneFrame.contentDocument.write(html);
                    zoneFrame.contentDocument.close();
                    document.getElementById('zoneName').textContent = file.name;
                    document.getElementById('zoneId').textContent = file.id;
                    document.getElementById('zoneAuthor').textContent = "by " + (file.author || "Unknown");
                    if (file.authorLink) {
                        document.getElementById('zoneAuthor').href = file.authorLink;
                    }
                    zoneViewer.style.display = "flex";
                    const newUrl = new URL(window.location);
                    newUrl.searchParams.set('id', file.id);
                    history.pushState(null, '', newUrl.toString());
                    zoneViewer.hidden = true;
                }).catch(error => alert("Failed to load zone: " + error));
            }
        }

        function aboutBlank() {
            const newWindow = window.open("about:blank", "_blank");
            const currentZoneId = document.getElementById('zoneId').textContent;
            const zone = zones.find(z => String(z.id) === String(currentZoneId));
            if (!zone) return;

            const url = getZoneUrl(zone);
            fetch(url + "?t=" + Date.now()).then(response => response.text()).then(html => {
                if (newWindow) {
                    newWindow.document.open();
                    newWindow.document.write(html);
                    newWindow.document.close();
                }
            });
        }

        function closeZone() {
            zoneViewer.hidden = false;
            zoneViewer.style.display = "none";
            zoneViewer.removeChild(zoneFrame);
            const url = new URL(window.location);
            url.searchParams.delete('id');
            history.pushState(null, '', url.toString());
        }

        function downloadZone() {
            const currentZoneId = document.getElementById('zoneId').textContent;
            const zone = zones.find(z => String(z.id) === String(currentZoneId));
            if (!zone) return;

            const url = getZoneUrl(zone);

            fetch(url + "?t=" + Date.now()).then(res => res.text()).then(text => {
                const blob = new Blob([text], {
                    type: "text/plain;charset=utf-8"
                });
                const blobUrl = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = blobUrl;
                a.download = zone.name + ".html";
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(blobUrl);
            });
        }

        function fullscreenZone() {
            if (zoneFrame.requestFullscreen) {
                zoneFrame.requestFullscreen();
            } else if (zoneFrame.mozRequestFullScreen) {
                zoneFrame.mozRequestFullScreen();
            } else if (zoneFrame.webkitRequestFullscreen) {
                zoneFrame.webkitRequestFullscreen();
            } else if (zoneFrame.msRequestFullscreen) {
                zoneFrame.msRequestFullscreen();
            }
        }


        function darkMode() {
            document.body.classList.toggle("dark-mode");
            const isDark = document.body.classList.contains("dark-mode");
            localStorage.setItem("theme", isDark ? "dark" : "light");

            const themeMeta = document.querySelector('meta[name="theme-color"]');
            if (themeMeta) {
                themeMeta.setAttribute("content", isDark ? "#14161d" : "#ffffff");
            }
        }

        function cloakIcon(url) {
            const link = document.querySelector("link[rel~='icon']");
            link.rel = "icon";
            if ((url + "").trim().length === 0) {
                link.href = "favicon.ico";
                localStorage.removeItem("cloakIcon");
            } else {
                link.href = url;
                localStorage.setItem("cloakIcon", url);
            }
            document.head.appendChild(link);
        }

        function cloakName(string) {
            if ((string + "").trim().length === 0) {
                document.title = "gn-science";
                localStorage.removeItem("cloakName");
                return;
            }
            document.title = string;
            localStorage.setItem("cloakName", string);
        }

        function tabCloak() {
            closePopup();
            document.getElementById('popupTitle').textContent = "Tab Cloak";
            const popupBody = document.getElementById('popupBody');
            popupBody.innerHTML = `<div style="display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 1.5rem;"><label for="tab-cloak-title-input" style="font-weight: 600; font-size: 0.9rem; color: var(--text-main);">Set Tab Title</label><input type="text" id="tab-cloak-title-input" placeholder="e.g. Google, Canvas, Home" oninput="cloakName(this.value)"></div><div style="display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 1.5rem;"><label for="tab-cloak-icon-input" style="font-weight: 600; font-size: 0.9rem; color: var(--text-main);">Set Tab Icon URL</label><input type="text" id="tab-cloak-icon-input" placeholder="e.g. https://google.com/favicon.ico" oninput="cloakIcon(this.value)"></div><button id="settings-button" onclick='document.getElementById("settings").click()' style="background-color: var(--surface-alt); text-align: center; width: 100%; margin-top: 0.5rem;">← Back to Settings</button>`;
            popupBody.contentEditable = false;
            document.getElementById('popupOverlay').style.display = "flex";
        }

        const settings = document.getElementById('settings');
        settings.addEventListener('click', () => {
            document.getElementById('popupTitle').textContent = "Settings";
            const popupBody = document.getElementById('popupBody');
            popupBody.innerHTML = `<button id="settings-button" onclick="darkMode()">Toggle Dark Mode</button><br><br><button id="settings-button" onclick="tabCloak()">Tab Cloak Settings</button><br><br><button id="settings-button" onclick="openMartyAboutBlank()">Open in about:blank</button><br><br><button id="settings-button" onclick="loadMoreLinks()">More Links</button><br><br><button id="settings-button" onclick="showDownloadMenu()">Download</button><br>`;
            popupBody.contentEditable = false;
            document.getElementById('popupOverlay').style.display = "flex";
        });

        async function loadMoreLinks() {
            closePopup();
            document.getElementById('popupTitle').textContent = "Alternative Links";
            const popupBody = document.getElementById('popupBody');
            popupBody.innerHTML = "<p>Loading alternative domains...</p>";
            document.getElementById('popupOverlay').style.display = "flex";

            try {
                const response = await fetch('./domains.json?t=' + Date.now());
                if (!response.ok) throw new Error("Could not retrieve domain list.");

                const data = await response.json();

                const domains = data.urls;

                if (!Array.isArray(domains) || domains.length === 0) {
                    popupBody.innerHTML = "<p>No links found in domains.json.</p>";
                    return;
                }

                const shuffled = [...domains].sort(() => 0.5 - Math.random());
                const selectedLinks = shuffled.slice(0, 4);

                let htmlContent = '<div class="settings-grid" style="margin-top: 10px; display: flex; flex-direction: column; gap: 10px;">';
                selectedLinks.forEach(url => {
                    let displayName = url;
                    try {
                        const parsed = new URL(url);
                        displayName = parsed.hostname;
                        if (displayName.startsWith('www.')) displayName = displayName.substring(4);
                    } catch (e) {}

                    htmlContent += `
                <a href="${url}" target="_blank" rel="noopener noreferrer" id="settings-button" style="display: block; text-decoration: none; text-align: center; line-height: 1.5;">
                    🌐 ${displayName}
                </a>
            `;
                });
                htmlContent += '</div>';

                htmlContent += '<br><button id="settings-button" onclick="document.getElementById(\'settings\').click()" style="background-color: var(--surface-alt); text-align: center;">← Back to Settings</button>';

                popupBody.innerHTML = htmlContent;

            } catch (error) {
                console.error(error);
                popupBody.innerHTML = `<p style="color: red;">Error fetching alternative links: ${error.message}</p>`;
            }
        }

        function showDownloadMenu() {
            document.getElementById('popupTitle').textContent = "Download Options";
            const popupBody = document.getElementById('popupBody');
            popupBody.innerHTML = `<button id="settings-button" onclick="promptPWAInstall()">Download App (PWA)</button><br><br><button id="settings-button" onclick="downloadEmbedHTML()">Download HTML</button><br><br><button id="settings-button" onclick='document.getElementById("settings").click()' style="background-color: var(--surface-alt); text-align: center;">← Back to Settings</button>`;
        }

        async function promptPWAInstall() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const {
                    outcome
                } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    console.log('User accepted the install prompt');
                } else {
                    console.log('User dismissed the install prompt');
                }
                deferredPrompt = null;
            } else {
                alert("App installation isn't available right now. You might have already installed it, or your browser doesn't support PWAs.");
            }
        }

        async function downloadEmbedHTML() {
            try {
                const response = await fetch('./embed.html?t=' + Date.now());
                if (!response.ok) throw new Error("Network response was not ok");

                const text = await response.text();
                const blob = new Blob([text], {
                    type: "text/html;charset=utf-8"
                });
                const url = URL.createObjectURL(blob);

                const a = document.createElement('a');
                a.href = url;
                a.download = 'Marty Games.html';
                document.body.appendChild(a);
                a.click();

                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            } catch (error) {
                console.error("Failed to download HTML:", error);
                alert("Failed to download the HTML file.");
            }
        }

        function showContact() {
